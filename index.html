<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>守艺声 · 声音档案原型</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --ink: #2d241d;
      --muted: #8b7965;
      --paper: #f3e6d2;
      --paper-2: #e3cfb3;
      --card: rgba(255, 248, 232, .78);
      --olive: #748064;
      --olive-dark: #4d5d43;
      --rust: #a84f31;
      --sun: #c89332;
      --tile: #68847b;
      --seal: #b44f2d;
      --terracotta: #bd6a43;
      --celadon: #9aac91;
      --line: rgba(29,34,31,.11);
      --shadow: 0 22px 60px rgba(35, 43, 31, .18);
    }
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; min-height: 100%; }
    body {
      background: #49372c;
      color: var(--ink);
      font-family: "DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { border: 0; cursor: pointer; }
    .workbench { min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    .prototype-note {
      position: fixed; left: 28px; top: 28px; width: 190px; color: rgba(245,242,234,.72);
      font-size: 11px; line-height: 1.65; letter-spacing: .03em;
    }
    .prototype-note strong { display: block; color: #fffaf0; font-family: "Space Grotesk"; font-size: 13px; letter-spacing: .08em; margin-bottom: 8px; }
    .phone {
      position: relative; width: 390px; height: 844px; max-width: calc(100vw - 42px); max-height: calc(100vh - 42px); aspect-ratio: 390 / 844;
      overflow: hidden; border-radius: 38px; background: var(--paper); box-shadow: var(--shadow); isolation: isolate;
    }
    .phone::before { content:""; position:absolute; z-index:0; inset:0; pointer-events:none; opacity:.2; background:radial-gradient(ellipse at 8% 10%, rgba(168,79,49,.42) 0 3%, transparent 3.5%), radial-gradient(ellipse at 97% 18%, rgba(104,132,123,.34) 0 8%, transparent 8.5%), radial-gradient(ellipse at 35% 94%, rgba(200,147,50,.3) 0 9%, transparent 9.5%), linear-gradient(143deg, transparent 0 38%, rgba(104,132,123,.11) 39% 40%, transparent 41% 100%); mask-image:linear-gradient(180deg, rgba(0,0,0,.45), transparent 58%); }
    .phone::after { content: ""; position:absolute; inset:0; pointer-events:none; opacity:.2; mix-blend-mode:multiply; background-image: radial-gradient(rgba(92,61,35,.11) .6px, transparent .7px); background-size: 5px 5px; }
    .screen { position: relative; height: 100%; overflow: auto; scrollbar-width: none; padding-bottom: calc(92px + env(safe-area-inset-bottom)); }
    .screen::-webkit-scrollbar { display:none; }
    .topbar { position: sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding: 21px 21px 12px; background: linear-gradient(var(--paper) 76%, transparent); }
    .time { font-size: 12px; font-weight: 700; letter-spacing: .03em; }
    .system-icons { display:flex; align-items:center; gap: 8px; color: var(--ink); }
    .system-icons span { font-size: 11px; font-weight:700; }
    .app-pad { padding: 0 21px; }
    .palette-strip { display:flex; gap:7px; margin-top:16px; }
    .palette-strip span { width:27px; height:10px; border-radius:999px; box-shadow:0 1px 0 rgba(45,36,29,.12); }
    .palette-strip .clay { background:var(--terracotta); }
    .palette-strip .ochre { background:var(--sun); }
    .palette-strip .glaze { background:var(--tile); }
    .palette-strip .celadon { background:var(--celadon); }
    .palette-strip .paper { background:#f8ecda; border:1px solid rgba(45,36,29,.1); }
    .kicker { text-transform: uppercase; font-size: 10px; letter-spacing: .16em; font-weight: 700; color: var(--olive-dark); }
    .display { font-family: "Space Grotesk", "PingFang SC", sans-serif; letter-spacing: -.045em; }
    h1,h2,h3,p { margin: 0; }
    h1 { font-size: 34px; line-height: 1.06; }
    h2 { font-size: 24px; line-height: 1.1; }
    h3 { font-size: 15px; line-height:1.25; }
    .muted { color: var(--muted); }
    .section-row { display:flex; align-items:center; justify-content:space-between; margin: 22px 0 11px; }
    .link { background: transparent; color: var(--olive-dark); font-size: 12px; font-weight: 700; }
    .hero-head { display:flex; justify-content:space-between; align-items:flex-start; padding-top: 5px; }
    .hero-head p { margin-top: 8px; font-size: 13px; color:var(--muted); line-height:1.55; max-width: 210px; }
    .avatar { width: 42px; height:42px; border-radius: 50%; display:grid; place-items:center; background: var(--ink); color:#f6deb1; font-family:"Space Grotesk"; font-size:14px; transform: rotate(5deg); }
    .device-card { margin-top: 20px; padding: 14px 15px; border:1px solid rgba(168,79,49,.15); border-radius: 20px; background: linear-gradient(90deg, rgba(255,249,235,.86), rgba(228,214,188,.64)); display:flex; justify-content:space-between; align-items:center; }
    .device-meta { display:flex; align-items:center; gap: 10px; }
    .device-dot { width: 30px; height:30px; border-radius:10px; background:var(--ink); color:#f6deb1; display:grid; place-items:center; font-size:16px; }
    .device-meta strong { display:block; font-size:12px; }
    .device-meta small { color:var(--muted); font-size:10px; }
    .device-battery { color:var(--olive-dark); font-size: 11px; font-weight:700; }
    .record-card { position:relative; margin-top: 17px; min-height: 235px; overflow:hidden; border-radius: 28px; padding: 20px; color:#fbf6e9; background: linear-gradient(135deg, #2d241d 0%, #59634b 100%); }
    .record-card::before { content:""; position:absolute; width: 280px; height: 280px; right:-120px; top:-130px; border: 1px solid rgba(231,185,83,.38); border-radius:50%; box-shadow: 0 0 0 21px rgba(231,185,83,.06), 0 0 0 43px rgba(231,185,83,.04), 0 0 0 65px rgba(231,185,83,.03); }
    .record-card::after { content:""; position:absolute; width: 240px; height:170px; right:-80px; bottom:-90px; border: 1px solid rgba(201,147,50,.44); border-radius:50%; transform:rotate(-20deg); }
    .record-copy { position:relative; z-index:1; }
    .record-copy .kicker { color: #d6c17b; }
    .record-copy h2 { max-width: 210px; margin-top: 8px; color:#fff8e8; }
    .record-copy p { margin-top: 7px; color:rgba(255,248,232,.64); font-size:12px; max-width: 208px; line-height:1.5; }
    .record-button { position:absolute; z-index:2; right: 18px; bottom: 18px; width: 78px; height:78px; border-radius:50%; display:grid; place-items:center; background: var(--sun); color:var(--ink); box-shadow: 0 7px 0 rgba(70,53,20,.36); transition: transform .18s ease, box-shadow .18s ease; }
    .record-button:hover { transform:translateY(-2px); box-shadow:0 9px 0 rgba(70,53,20,.36); }
    .record-button .inner { width: 28px; height:28px; border: 3px solid var(--ink); border-radius: 50%; }
    .wave { display:flex; align-items:center; gap: 4px; height:42px; margin-top: 21px; }
    .wave i { display:block; width:3px; border-radius: 9px; background: #d3a74b; animation: wave 1.1s ease-in-out infinite; }
    .wave i:nth-child(1){height:14px;animation-delay:.02s}.wave i:nth-child(2){height:26px;animation-delay:.12s}.wave i:nth-child(3){height:36px;animation-delay:.21s}.wave i:nth-child(4){height:20px;animation-delay:.32s}.wave i:nth-child(5){height:29px;animation-delay:.18s}.wave i:nth-child(6){height:12px;animation-delay:.4s}.wave i:nth-child(7){height:31px;animation-delay:.27s}.wave i:nth-child(8){height:19px;animation-delay:.1s}.wave i:nth-child(9){height:38px;animation-delay:.34s}.wave i:nth-child(10){height:16px;animation-delay:.24s}
    @keyframes wave { 0%,100%{transform:scaleY(.55);opacity:.65}50%{transform:scaleY(1);opacity:1} }
    .archive-list { display:grid; gap: 10px; }
    .archive-item { display:flex; align-items:center; gap: 12px; padding: 13px 12px; border-radius:18px; border:1px solid var(--line); background: var(--card); text-align:left; }
    .archive-icon { flex:0 0 38px; width:38px; height:38px; border-radius: 13px; display:grid; place-items:center; color:var(--ink); background:#c6c7a4; }
    .archive-icon.story { background:#e4b18d; }
    .archive-item strong { display:block; font-size:13px; }
    .archive-item small { display:block; margin-top:4px; color:var(--muted); font-size:10px; }
    .item-chevron { margin-left:auto; color:var(--muted); font-size:19px; }
    .bottom-nav { position:absolute; z-index:10; bottom:0; left:0; right:0; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding: 14px 17px 18px; background: linear-gradient(transparent, rgba(245,242,234,.97) 28%); }
    .nav-btn { display:grid; place-items:center; gap:4px; background:transparent; color:#9a9d94; font-size:10px; font-weight:600; }
    .nav-btn.active { color:var(--ink); }
    .nav-symbol { width:23px; height:23px; border-radius: 9px; display:grid; place-items:center; font-size:16px; }
    .nav-btn.active .nav-symbol { background:var(--ink); color:#f7e2b3; }
    .back-row { display:flex; align-items:center; gap:12px; padding-top: 6px; }
    .back-button { width:35px; height:35px; border-radius:12px; background:rgba(255,255,255,.58); color:var(--ink); font-size:19px; }
    .subtle-card { border:1px solid rgba(168,79,49,.13); background:var(--card); border-radius:22px; box-shadow:0 8px 24px rgba(112,74,42,.05); }
    .auth-page { min-height: calc(100% - 60px); padding: 12px 21px 34px; display:flex; flex-direction:column; }
    .brand-lockup { display:flex; align-items:center; gap:10px; color:var(--ink); font-family:"Space Grotesk"; font-size:13px; font-weight:700; letter-spacing:.06em; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; border-radius:12px; color:#f8e3ae; background:var(--ink); font-size:17px; }
    .auth-hero { margin-top:58px; }
    .auth-hero h1 { margin-top:10px; font-size:38px; }
    .auth-hero p { max-width:270px; margin-top:12px; color:var(--muted); font-size:13px; line-height:1.65; }
    .auth-illustration { position:relative; height:190px; margin:34px -21px 0; overflow:hidden; background:linear-gradient(135deg,#dfe5ca 0%,#eee6d2 62%,#f5f2ea 100%); }
    .auth-illustration::before { content:""; position:absolute; width:230px; height:230px; left:-60px; top:-112px; border:1px solid rgba(80,104,58,.24); border-radius:50%; box-shadow:0 0 0 22px rgba(80,104,58,.06),0 0 0 46px rgba(80,104,58,.045); }
    .auth-illustration::after { content:""; position:absolute; width:330px; height:100px; left:70px; bottom:-53px; border:1px solid rgba(200,111,66,.27); border-radius:50%; transform:rotate(-16deg); }
    .sound-mark { position:absolute; left:50%; top:48%; z-index:1; width:104px; height:104px; transform:translate(-50%,-50%) rotate(-8deg); display:grid; place-items:center; border:1px solid rgba(29,34,31,.12); border-radius:34px; color:var(--ink); background:rgba(255,255,252,.7); box-shadow:12px 12px 0 rgba(80,104,58,.14); }
    .auth-footer { margin-top:auto; color:var(--muted); font-size:10px; line-height:1.6; }
    .auth-form { margin-top:34px; display:grid; gap:12px; }
    .login-methods { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:25px; }
    .method-btn { min-height:48px; display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); border-radius:15px; color:var(--muted); background:rgba(255,255,255,.44); font-size:12px; font-weight:700; }
    .method-btn.active { color:var(--ink); border-color:var(--olive-dark); background:#e6e7d9; box-shadow:inset 0 -2px 0 var(--olive-dark); }
    .wechat-mark { width:20px; height:20px; display:grid; place-items:center; border-radius:50%; color:#f7f2e7; background:#5e9271; font-size:11px; }
    .phone-mark { width:20px; height:20px; display:grid; place-items:center; border-radius:7px; color:#f7f2e7; background:var(--tile); font-size:11px; }
    .wechat-card { margin-top:18px; padding:22px 17px; text-align:center; border:1px solid rgba(75,101,93,.17); border-radius:22px; background:#e7e9dc; }
    .wechat-card .wechat-mark { width:48px; height:48px; margin:0 auto 13px; font-size:22px; }
    .wechat-card h3 { font-size:17px; }
    .wechat-card p { max-width:230px; margin:7px auto 0; color:#6c766d; font-size:11px; line-height:1.55; }
    .form-label { color:var(--muted); font-size:11px; font-weight:700; }
    .text-input { width:100%; height:50px; border:1px solid var(--line); outline:0; padding:0 14px; border-radius:15px; color:var(--ink); background:rgba(255,255,255,.58); font-size:14px; }
    .text-input:focus { border-color:var(--olive); box-shadow:0 0 0 3px rgba(129,148,93,.12); }
    .form-error { color:#aa5435; font-size:11px; line-height:1.45; }
    .consent { display:flex; align-items:flex-start; gap:8px; color:var(--muted); font-size:10px; line-height:1.5; }
    .consent input { accent-color:var(--olive-dark); margin-top:2px; }
    .auth-primary { width:100%; min-height:50px; margin-top:5px; border-radius:16px; color:#fff8e8; background:var(--ink); font-size:13px; font-weight:700; }
    .auth-secondary { width:100%; min-height:46px; border-radius:15px; color:var(--olive-dark); background:rgba(255,255,255,.42); border:1px solid var(--line); font-size:12px; font-weight:700; }
    .code-hint { padding:12px 13px; border-radius:15px; background:#e8ebdc; color:#66705d; font-size:11px; line-height:1.5; }
    .bluetooth-page { min-height:calc(100% - 60px); padding:10px 21px 34px; display:flex; flex-direction:column; }
    .permission-art { position:relative; width:132px; height:132px; margin:40px auto 24px; display:grid; place-items:center; border-radius:42px; color:var(--olive-dark); background:#e8ebdc; box-shadow:0 0 0 16px rgba(129,148,93,.08), 0 0 0 32px rgba(129,148,93,.045); }
    .permission-art::before { content:""; position:absolute; inset:19px; border:1px dashed rgba(80,104,58,.35); border-radius:50%; }
    .bluetooth-page h1 { font-size:30px; text-align:center; }
    .bluetooth-page .lead { max-width:286px; margin:11px auto 0; color:var(--muted); font-size:12px; line-height:1.65; text-align:center; }
    .permission-list { display:grid; gap:10px; margin-top:25px; }
    .permission-row { display:flex; align-items:center; gap:10px; padding:12px 13px; border-radius:16px; background:rgba(255,255,255,.5); border:1px solid var(--line); }
    .permission-row span:first-child { width:28px; height:28px; display:grid; place-items:center; border-radius:9px; background:#e4e9d7; color:var(--olive-dark); }
    .permission-row strong { display:block; font-size:11px; }
    .permission-row small { display:block; margin-top:3px; color:var(--muted); font-size:10px; }
    .bottom-actions { display:grid; gap:10px; margin-top:auto; }
    .scan-header { display:flex; align-items:flex-start; justify-content:space-between; margin-top:36px; }
    .scan-header h1 { text-align:left; font-size:28px; }
    .scan-header p { margin-top:7px; color:var(--muted); font-size:11px; }
    .scan-pulse { position:relative; width:48px; height:48px; display:grid; place-items:center; border-radius:50%; color:var(--olive-dark); background:#e5ebd7; }
    .scan-pulse::before { content:""; position:absolute; inset:-8px; border:1px solid rgba(129,148,93,.25); border-radius:50%; animation:pulse 1.8s ease-out infinite; }
    @keyframes pulse { 0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.25);opacity:0} }
    .device-list { display:grid; gap:10px; margin-top:28px; }
    .device-row { width:100%; display:flex; align-items:center; gap:12px; padding:14px; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.58); color:var(--ink); text-align:left; }
    .device-row:hover { border-color:var(--olive); }
    .device-row .device-dot { flex:0 0 36px; width:36px; height:36px; }
    .device-row strong { display:block; font-size:12px; }
    .device-row small { display:block; margin-top:4px; color:var(--muted); font-size:10px; }
    .device-row .item-chevron { margin-left:auto; }
    .connecting-card { margin-top:34px; padding:23px; text-align:center; }
    .connection-ring { width:92px; height:92px; margin:0 auto 18px; display:grid; place-items:center; border-radius:50%; color:var(--olive-dark); background:#e5ebd7; box-shadow:0 0 0 14px rgba(129,148,93,.09),0 0 0 28px rgba(129,148,93,.05); }
    .connecting-card h2 { font-size:21px; }
    .connecting-card p { margin-top:8px; color:var(--muted); font-size:11px; line-height:1.55; }
    .connected-card { margin-top:42px; padding:23px; text-align:center; background:#e8ebdc; border:1px solid rgba(80,104,58,.12); border-radius:24px; }
    .connected-check { width:74px; height:74px; margin:0 auto 18px; display:grid; place-items:center; border-radius:50%; color:#f8e7bd; background:var(--olive-dark); }
    .connected-card h2 { font-size:22px; }
    .connected-card p { margin-top:8px; color:#68715f; font-size:11px; line-height:1.55; }
    .screen-title-note { margin-top:18px; color:var(--muted); font-size:10px; text-align:center; letter-spacing:.04em; }
    .recording-page { padding-top: 4px; }
    .recording-stage { position:relative; min-height: 410px; margin-top: 22px; overflow:hidden; border-radius:30px; color:#fbf6e9; background:var(--ink); display:flex; flex-direction:column; align-items:center; padding-top:35px; }
    .recording-stage::before { content:""; position:absolute; width: 270px; height:270px; top: 40px; border:1px solid rgba(230,185,83,.38); border-radius:50%; box-shadow: 0 0 0 28px rgba(230,185,83,.06), 0 0 0 56px rgba(230,185,83,.045), 0 0 0 84px rgba(230,185,83,.03); }
    .recording-stage .kicker { color:#d8c47b; }
    .record-time { position:relative; z-index:1; margin-top: 12px; font: 600 54px/1 "Space Grotesk"; letter-spacing:-.06em; }
    .record-label { position:relative; z-index:1; margin-top: 9px; color: rgba(255,248,232,.64); font-size:12px; }
    .stage-wave { position:relative; z-index:1; margin-top:24px; }
    .mark-button { position:absolute; z-index:2; left:50%; transform:translateX(-50%); bottom:26px; width:64px; height:64px; border-radius:50%; background:var(--rust); color:#fff4de; font-size:24px; box-shadow: 0 6px 0 #7d432e; }
    .stop-row { display:flex; justify-content:center; gap:12px; margin-top: 18px; }
    .outline-button, .solid-button { min-height:46px; border-radius:15px; padding: 0 19px; font-size:13px; font-weight:700; }
    .outline-button { color:var(--ink); background:rgba(255,255,255,.5); border:1px solid var(--line); }
    .solid-button { color:#fff8e8; background:var(--ink); }
    .solid-button.olive { background:var(--olive-dark); }
    .small-note { padding: 14px 15px; margin-top:16px; display:flex; gap:10px; align-items:flex-start; font-size:11px; line-height:1.55; color:var(--muted); background:rgba(255,248,232,.56); }
    .small-note b { color:var(--olive-dark); }
    .ai-page { padding-top: 4px; }
    .progress-shell { margin-top: 24px; }
    .progress-track { height:6px; border-radius:99px; background:#deded1; overflow:hidden; }
    .progress-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg, var(--olive), var(--sun)); transition:width .5s ease; }
    .progress-meta { display:flex; justify-content:space-between; margin-top:8px; color:var(--muted); font-size:11px; }
    .ai-orb { width:142px; height:142px; margin: 34px auto 20px; border-radius:50%; display:grid; place-items:center; color:var(--ink); background: radial-gradient(circle at 36% 30%, #f8df9b, #d2c66c 58%, #7c8e5e 100%); box-shadow: 0 0 0 16px rgba(129,148,93,.12), 0 0 0 32px rgba(129,148,93,.07); }
    .ai-orb span { font: 700 42px "Space Grotesk"; letter-spacing:-.1em; }
    .ai-copy { text-align:center; }
    .ai-copy p { margin:8px auto 0; color:var(--muted); font-size:12px; line-height:1.55; max-width:260px; }
    .transcript-card { margin-top:25px; padding:16px; }
    .transcript-head { display:flex; justify-content:space-between; align-items:center; }
    .pill { display:inline-flex; align-items:center; gap:5px; padding:6px 9px; border-radius:99px; background:#e5e9d9; color:var(--olive-dark); font-size:10px; font-weight:700; }
    .transcript-text { margin-top:15px; font-size:13px; line-height:1.72; color:#454b42; }
    .highlight { color:var(--olive-dark); background: #e4ebc8; border-radius:4px; padding:1px 3px; }
    .follow-page { padding-top:4px; }
    .question-card { margin-top:21px; padding:17px; background:#e8ebdc; border:1px solid rgba(80,104,58,.12); border-radius:23px; }
    .question-card .label { color:var(--olive-dark); font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .question-card h2 { margin-top:10px; font-size:21px; }

    function Welcome({onStart}) {
      return <div className="auth-page"><div className="brand-lockup"><span className="brand-mark">⌂</span><span>守艺声 · 文保档案</span></div><div className="auth-hero"><div className="kicker">一砖一瓦 · 都有回声</div><h1 className="display">守护一座古建，<br/><span style={{color:'var(--rust)'}}>先留下它的声音。</span></h1><p>为文物保护员设计的现场记录工具，把巡查经验、修缮细节和乡土记忆，变成可传承的声音档案。</p><div className="palette-strip" aria-label="唐三彩色板"><span className="clay"/><span className="ochre"/><span className="glaze"/><span className="celadon"/><span className="paper"/></div><div className="glaze-plaque" aria-label="唐三彩釉色纹样"><span className="glaze-band band-a"/><span className="glaze-band band-b"/><span className="glaze-band band-c"/><span className="glaze-seal">唐</span></div></div><div className="auth-illustration"><div className="sound-mark"><Icon name="microphone" size={40}/></div></div><div className="auth-footer">你的录音会在本地自动保存，并在连接网络后加密同步。<button className="auth-primary" style={{marginTop:13}} onClick={onStart}>开始使用 <span style={{marginLeft:7}}>→</span></button></div></div>;
    }

    function Login({onDone, onBack}) {
      const [method,setMethod]=useState('wechat'); const [step,setStep]=useState('phone'); const [phone,setPhone]=useState(''); const [code,setCode]=useState(''); const [agreed,setAgreed]=useState(false); const [error,setError]=useState('');
      const next=()=>{ if(method==='wechat'){ if(!agreed){setError('请先同意服务协议和隐私说明');return} setError('');onDone(); return; } if(step==='phone'){ if(phone.replace(/\D/g,'').length<6){setError('请输入有效的手机号');return} if(!agreed){setError('请先同意服务协议和隐私说明');return} setError('');setStep('code'); } else { if(code.trim().length<4){setError('请输入验证码（原型中输入任意 4 位即可）');return} setError('');onDone(); } };
      const choose=(nextMethod)=>{setMethod(nextMethod);setStep('phone');setError('');};
      return <div className="auth-page"><BackRow title={method==='phone'&&step==='code'?'验证身份':'登录守艺声'} onBack={method==='phone'&&step==='code'?()=>{setError('');setStep('phone')}:onBack}/><div className="auth-hero" style={{marginTop:38}}><div className="kicker">{method==='phone'&&step==='code'?'安全验证':'欢迎回来'}</div><h1 className="display">{method==='phone'&&step==='code'?<>输入验证码，<br/><span style={{color:'var(--olive-dark)'}}>继续连接设备。</span></>:<>把下一段声音<br/><span style={{color:'var(--olive-dark)'}}>接着留下。</span></>}</h1><p>{method==='phone'&&step==='code'?'验证码已发送到你的手机号。原型中输入任意 4 位数字即可继续。':'登录后，你的录音会和硬件麦克风、档案库保持同步。'}</p></div>{!(method==='phone'&&step==='code')&&<div className="login-methods"><button className={'method-btn '+(method==='wechat'?'active':'')} onClick={()=>choose('wechat')}><span className="wechat-mark">微</span>微信登录</button><button className={'method-btn '+(method==='phone'?'active':'')} onClick={()=>choose('phone')}><span className="phone-mark">⌕</span>手机号登录</button></div>}<div className="auth-form">{method==='wechat'?<div className="wechat-card"><h3>使用微信安全登录</h3><p>将使用微信确认你的身份，不读取与文保工作无关的信息。</p></div>:step==='phone'?<><label className="form-label">手机号</label><input className="text-input" inputMode="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="例如 138 0000 1131"/></>:<><label className="form-label">验证码</label><input className="text-input" inputMode="numeric" maxLength="6" value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,''))} placeholder="输入验证码"/><div className="code-hint">演示提示：输入任意 4 位数字，例如 <b>1131</b>。</div></>}{(method==='wechat'||step==='phone')&&<label className="consent"><input type="checkbox" checked={agreed} onChange={e=>setAgreed(e.target.checked)}/><span>我同意《服务协议》和《隐私说明》，并允许守艺声在本设备保存录音。</span></label>}{error&&<div className="form-error">{error}</div>}<button className="auth-primary" onClick={next}>{method==='wechat'?'微信授权登录':step==='phone'?'获取验证码':'验证并继续'} <span style={{marginLeft:7}}>→</span></button>{method==='phone'&&step==='code'&&<button className="auth-secondary" onClick={()=>setStep('phone')}>修改手机号</button>}</div><div className="auth-footer">守艺声只在你授权的设备上工作，连接硬件麦克风后才会开始同步录音。</div></div>;

      useEffect(()=>{ if(status!=='connecting') return; const t=setTimeout(()=>setStatus('connected'),1000); return()=>clearTimeout(t); },[status]);

      if(status==='scan') return <div className="bluetooth-page"><BackRow title="选择设备" onBack={()=>setStatus('permission')}/><div className="scan-header"><div><div className="kicker">第二步 · 附近的设备</div><h1 className="display" style={{marginTop:9}}>正在寻找<br/><span style={{color:'var(--olive-dark)'}}>现场麦克风。</span></h1><p>请将硬件麦克风放在手机旁边并保持开机。</p></div><div className="scan-pulse"><img className="device-cutout" src="propagation-km-assets/hardware-mic-transparent.png" alt="文保麦克风"/></div></div><div className="device-list"><button className="device-row" onClick={()=>setStatus('connecting')}><span className="device-dot">⌁</span><span><strong>便携式文保麦克风</strong><small>可连接 · 电量 78%</small></span><span className="item-chevron">›</span></button><button className="device-row" onClick={()=>setStatus('connecting')}><span className="device-dot" style={{background:'#d5d8c8',color:'var(--olive-dark)'}}>⌁</span><span><strong>现场麦克风 · 备用</strong><small>可连接 · 电量 42%</small></span><span className="item-chevron">›</span></button></div><div className="bottom-actions"><button className="auth-secondary" onClick={()=>setStatus('scan')}>重新搜索</button><div className="screen-title-note">找不到设备？确认麦克风已开机，并长按配对键 3 秒</div></div></div>;
      if(status==='connecting') return <div className="bluetooth-page"><BackRow title="正在连接" onBack={()=>setStatus('scan')}/><div className="connecting-card subtle-card"><div className="connection-ring"><Icon name="bluetooth" size={30}/></div><h2 className="display">正在连接麦克风</h2><p>正在建立安全连接，请稍等一下。<br/>连接完成后会自动同步设备状态。</p><div className="progress-track" style={{marginTop:22}}><div className="progress-fill" style={{width:'68%'}}/></div></div><div className="bottom-actions"><button className="auth-secondary" onClick={()=>setStatus('scan')}>取消连接</button></div></div>;
      return <div className="bluetooth-page"><BackRow title="连接完成" onBack={()=>setStatus('scan')}/><div className="connected-card"><div className="connected-check"><Icon name="check" size={34}/></div><div className="kicker" style={{color:'var(--olive-dark)'}}>第三步 · 已连接</div><h2 className="display" style={{marginTop:9}}>可以开始留下<br/>第一段声音了。</h2><p>便携式文保麦克风<br/>双麦收音 · 电量 78% · 预计续航 8 小时</p></div><div className="permission-list" style={{marginTop:22}}><div className="permission-row"><span><Icon name="check" size={15}/></span><div><strong>硬件按键已就绪</strong><small>单击开始 / 结束录音，双击标记重点</small></div></div><div className="permission-row"><span><Icon name="check" size={15}/></span><div><strong>离线录音已开启</strong><small>无网络时也能记录，联网后自动同步</small></div></div></div><div className="bottom-actions"><button className="solid-button olive" style={{width:'100%'}} onClick={onDone}>进入守艺声 <span style={{marginLeft:6}}>→</span></button></div></div>;
    }

    function Home({goRecord, openDetail, setView, showToast}) {
      return <>
        <div className="app-pad">
          <div className="hero-head"><div><div className="kicker">文保声音档案 / 01</div><h1 className="display" style={{marginTop:9}}>一砖一瓦，<br/><em style={{fontStyle:'normal', color:'var(--rust)'}}>都有回声。</em></h1><p>把巡查里的经验、现场和故事，和古建一起留给下一代。</p><div className="palette-strip" aria-label="唐三彩色板"><span className="clay"/><span className="ochre"/><span className="glaze"/><span className="celadon"/><span className="paper"/></div><div className="glaze-plaque" aria-label="今日釉色灵感"><span className="glaze-band band-a"/><span className="glaze-band band-b"/><span className="glaze-band band-c"/><span className="glaze-seal">守</span></div></div><div className="avatar">守</div></div>

          <div className="record-card"><div className="record-copy"><div className="kicker">晋北古建 · 今日巡查</div><h2 className="display">把听见的，<br/>现在说下来。</h2><p>单击硬件麦克风即可录音，双击标记重点。手机不在手边也没关系。</p><div className="wave">{Array.from({length:10}).map((_,i)=><i key={i}/>)}</div></div><button className="record-button" onClick={goRecord} aria-label="开始录音"><img className="record-product" src="propagation-km-assets/hardware-mic-transparent.png" alt="" aria-hidden="true"/></button></div>

    function Recording({onBack, onFinish, showToast}) {
      const [seconds, setSeconds] = useState(86); const [paused, setPaused] = useState(false); const [marks, setMarks] = useState(2);
      useEffect(()=>{ if(paused) return; const t=setInterval(()=>setSeconds(s=>s+1),1000); return()=>clearInterval(t); },[paused]);
      const time = `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;

    function AIProcessing({onBack, onNext}) {
      const [progress, setProgress] = useState(24);
      useEffect(()=>{const t=setInterval(()=>setProgress(p=>p>=100?100:p+13),650); return()=>clearInterval(t)},[]);
      const done=progress>=100;
      return <div className="app-pad ai-page"><BackRow title="AI 正在理解" onBack={onBack}/><div className="progress-shell"><div className="progress-track"><div className="progress-fill" style={{width:progress+'%'}}/></div><div className="progress-meta"><span>{done?'整理完成':'正在转写 · 识别方言和现场声音'}</span><span>{progress}%</span></div></div><div className="ai-orb"><span>✦</span></div><div className="ai-copy"><div className="kicker">守艺声 · 智能整理</div><h2 className="display" style={{marginTop:9}}>{done?'这段经验值得留下':'先听懂，再追问'}</h2><p>{done?'我从这段录音里找到了 2 个关键知识点。再补充一个细节，它就能成为完整的养护手册片段。':'录音正在变成可检索的文字，重点标记会优先被我读懂。'}</p></div><div className="transcript-card subtle-card"><div className="transcript-head"><h3>转写初稿</h3><span className="pill"><Icon name="spark" size={11}/> 重点 02</span></div><p className="transcript-text">“这个季节墙角容易返潮，要特别看这里。<span className="highlight">先摸木头底下有没有发凉</span>，再看看灰缝里是不是有一点发黑……”</p></div><button className="solid-button olive" style={{width:'100%',marginTop:14}} onClick={onNext}>{done?'补充一个细节':'查看 AI 追问'} <span style={{marginLeft:6}}>→</span></button></div>;
    }

    function FollowUp({onBack, onDone, showToast}) {
      const [kind, setKind] = useState('knowledge'); const [answer,setAnswer]=useState(''); const [voice,setVoice]=useState(false);
      return <div className="app-pad follow-page"><BackRow title="补充一点细节" onBack={onBack} right={<span className="kicker">02 / 02</span>}/><div className="question-card"><div className="label">AI 追问 · 根据你的录音</div><h2 className="display">这个判断，最适用于<br/><span style={{color:'var(--olive-dark)'}}>什么材质的古建？</span></h2><p>补充后，我会把它整理成别人也能照着做的知识卡片。</p><div className="choice-row"><button className={'choice '+(kind==='knowledge'?'selected':'')} onClick={()=>setKind('knowledge')}><span className="emoji">🧱</span><strong>专业知识</strong><small>变成养护手册</small></button><button className={'choice '+(kind==='story'?'selected':'')} onClick={()=>setKind('story')}><span className="emoji">📖</span><strong>口述故事</strong><small>保留人的声音</small></button></div></div><div className="answer-box subtle-card"><textarea value={answer} onChange={e=>setAnswer(e.target.value)} placeholder="可以直接说，也可以输入……"/><div className="answer-actions"><button className="voice-answer" onClick={()=>{setVoice(v=>!v);showToast(voice?'已结束语音回答':'正在听，你可以开始说了')}}>{voice?'■ 结束回答':'● 语音回答'}</button><span className="muted" style={{fontSize:10}}>{answer.length}/120</span></div></div><button className="solid-button olive" style={{width:'100%',marginTop:14}} onClick={onDone}><Icon name="check" size={16}/> 完成并归档</button></div>;
    }

    function Library({openDetail, setView}) {
      const [tab,setTab]=useState('knowledge'); const [query,setQuery]=useState('');
      const shown=useMemo(()=>archives.filter(a=>a.kind===tab && (a.title+a.summary+a.tags.join('')).toLowerCase().includes(query.toLowerCase())),[tab,query]);
      return <div className="app-pad library-page"><div className="library-top"><div><div className="kicker">我的声音档案</div><h1 className="display" style={{marginTop:8}}>留下来的<br/><span style={{color:'var(--olive-dark)'}}>都算数。</span></h1></div><span className="count-badge">{archives.length} 条记录</span></div><div className="search-box subtle-card"><Icon name="search" size={16}/><input value={query} onChange={e=>setQuery(e.target.value)} placeholder="搜索点位、经验或故事"/></div><div className="tabs"><button className={'tab '+(tab==='knowledge'?'active':'')} onClick={()=>setTab('knowledge')}>专业知识 <span style={{fontSize:10}}>02</span></button><button className={'tab '+(tab==='story'?'active':'')} onClick={()=>setTab('story')}>口述故事 <span style={{fontSize:10}}>02</span></button></div>{shown.map(item=><button className="library-card subtle-card" key={item.id} onClick={()=>openDetail(item)}><div className="card-top"><span className={'type-mark '+(item.kind==='story'?'story':'')}><Icon name={item.kind==='story'?'bookmark':'microphone'} size={17}/></span><span><strong>{item.kind==='story'?'口述故事':'专业知识'}</strong><small>{item.meta}</small></span><span className="item-chevron">›</span></div><h3 className="card-title">{item.title}</h3><p className="card-summary">{item.summary}</p><div className="tag-row">{item.tags.map(t=><span className="tag" key={t}>{t}</span>)}</div></button>)}{!shown.length&&<div className="small-note subtle-card">还没有找到匹配的声音，试试换一个关键词。</div>}</div>;
    }

    function Detail({item,onBack}) {
      return <div className="app-pad detail-page"><BackRow title="声音详情" onBack={onBack} right={<button className="link"><Icon name="more" size={18}/></button>}/><div className="detail-hero"><div className="kicker">{item.kind==='story'?'口述故事':'专业知识'} · 已归档</div><h2 className="display">{item.title}</h2><div className="detail-meta"><span>2026.09.17</span><span>董师傅</span><span>山西 · {item.kind==='story'?'戏台':'古建点位 A-03'}</span></div><div className="player"><button className="play-button">▶</button><div className="player-line"><i/></div><span className="player-time">01:24 / {item.meta.split('·').pop()}</span></div></div><div className="detail-section subtle-card"><h3>AI 整理摘要 <span className="pill"><Icon name="spark" size={11}/> 已理解</span></h3><p>{item.kind==='story'?'董师傅从一场大雪讲起，回忆这座戏台如何在几代人的守护下留下来。故事里有修缮的细节，也有村庄从前的样子。':'返潮判断来自三个动作：先摸木头底部的温度，再观察灰缝颜色，最后对照近一周的天气。雨季前要把墙角和檐口列为重点。'}</p></div><div className="detail-section subtle-card"><h3>{item.kind==='story'?'故事线索':'养护要点'}</h3><div className="bullet-list">{(item.kind==='story'?['故事发生在 1994 年冬天','地点：村口老戏台','保留原始语气与方言片段']:['适用：木构、砖木混合结构','观察：墙角发凉、灰缝发黑','周期：雨季前后各检查一次']).map(x=><div className="bullet" key={x}>{x}</div>)}</div></div></div>;
    }

    function Profile({onOpenSetting}) {
      return <div className="app-pad profile-page"><div className="kicker">我的工作台</div><div className="profile-header"><div className="profile-avatar">张</div><div><h2 className="display">张老师</h2><p>山西 · 乡村文保员 · 加入 18 天</p></div></div><div className="device-card" style={{marginTop:25}}><div className="device-meta"><div className="device-dot">⌁</div><div><strong>便携式文保麦克风</strong><small><span style={{color:'var(--olive-dark)'}}>● 已连接</span> · 最后同步 2 分钟前</small></div></div><div className="device-battery">78%</div></div><div className="settings-list"><button type="button" className="setting-row subtle-card" onClick={()=>onOpenSetting('device')}><span className="setting-icon"><Icon name="bluetooth" size={16}/></span><span style={{flex:1}}><strong>设备与连接</strong><small>硬件麦克风、自动同步、离线缓存</small></span><span className="item-chevron">›</span></button><button type="button" className="setting-row subtle-card" onClick={()=>onOpenSetting('storage')}><span className="setting-icon"><Icon name="clock" size={16}/></span><span style={{flex:1}}><strong>存储空间</strong><small>本地 1.8 GB · 云端已加密备份</small></span><span className="item-chevron">›</span></button><button type="button" className="setting-row subtle-card" onClick={()=>onOpenSetting('ai')}><span className="setting-icon"><Icon name="spark" size={16}/></span><span style={{flex:1}}><strong>AI 识别偏好</strong><small>普通话 + 山西方言 · 文保场景</small></span><span className="item-chevron">›</span></button></div><div className="small-note subtle-card"><span style={{fontSize:15}}>◎</span><span>无网络时也可以正常录音和标记，联网后会自动同步。</span></div></div>;
    }

    function SettingsDetail({type, onBack, onDeviceSetup}) {
      const [language, setLanguage] = useState('普通话 + 山西方言');
      const titles = {device:'设备与连接', storage:'存储空间', ai:'AI 识别偏好'};
      return <div className="app-pad settings-page"><BackRow title={titles[type]} onBack={onBack}/>{type==='device'&&<><div className="settings-summary"><h2 className="display">麦克风已连接</h2><p>便携式文保麦克风 · 双麦收音<br/>电量 78% · 最后同步 2 分钟前</p><p>离线录音已开启。连接设备可进行重新搜索与配对。</p></div><button className="solid-button olive" style={{width:'100%',marginTop:14}} onClick={onDeviceSetup}>重新搜索设备 →</button></>}{type==='storage'&&<div className="settings-summary"><h2 className="display">本地存储</h2><p>已使用 1.8 GB / 5 GB</p><div className="storage-meter"><span/></div><p>云端备份已加密开启。录音同步后，本地文件仍会保留以便离线查看。</p><div className="settings-choice" aria-label="云端备份状态"><span>云端加密备份</span><strong style={{color:'var(--olive-dark)'}}>已开启</strong></div></div>}{type==='ai'&&<div className="settings-summary"><h2 className="display">识别语言</h2><p>选择录音整理时优先识别的语言与方言。</p>{['普通话 + 山西方言','普通话','普通话 + 晋语'].map(option=><button type="button" key={option} className={'settings-choice '+(language===option?'selected':'')} onClick={()=>setLanguage(option)}><span>{option}</span><span>{language===option?'✓':'○'}</span></button>)}</div>}</div>;
    }

    function App() {
      const [view,setView]=useState('welcome'); const [detail,setDetail]=useState(null); const [toast,setToast]=useState('');
      const showToast=(msg)=>{setToast(msg); setTimeout(()=>setToast(''),2300)};
      const openDetail=(item)=>{setDetail(item);setView('detail')};
      const goRecord=()=>setView('recording');
      const navView = (v)=>{setDetail(null);setView(v)};
      return <div className="workbench"><div className="prototype-note"><strong>守艺声</strong>移动 App 交互原型<br/>唐三彩色系 / 流釉纹理<br/><br/>规格：390 × 844 px<br/>点击从登录开始体验完整流程。</div><main className="phone"><div className="screen"><TopBar/>{view==='welcome'&&<Welcome onStart={()=>setView('login')}/>} {view==='login'&&<Login onBack={()=>setView('welcome')} onDone={()=>setView('bluetooth')}/>} {view==='bluetooth'&&<BluetoothSetup onBack={()=>setView('login')} onDone={()=>setView('home')}/>} {view==='home'&&<Home goRecord={goRecord} openDetail={openDetail} setView={navView} showToast={showToast}/>} {view==='recording'&&<Recording onBack={()=>setView('home')} onFinish={()=>setView('processing')} showToast={showToast}/>} {view==='processing'&&<AIProcessing onBack={()=>setView('recording')} onNext={()=>setView('followup')}/>} {view==='followup'&&<FollowUp onBack={()=>setView('processing')} onDone={()=>{showToast('已归档到「专业知识库」');setView('library')}} showToast={showToast}/>} {view==='library'&&<Library openDetail={openDetail} setView={navView}/>} {view==='detail'&&detail&&<Detail item={detail} onBack={()=>setView('library')}/>} {view==='profile'&&<Profile onOpenSetting={kind=>setView('settings-'+kind)}/>} {view.startsWith('settings-')&&<SettingsDetail type={view.slice(9)} onBack={()=>setView('profile')} onDeviceSetup={()=>setView('bluetooth')}/>}</div>{['home','library','profile'].includes(view)&&<BottomNav view={view} setView={navView}/>}<div className={'toast '+(toast?'show':'')}>{toast}</div></main></div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
